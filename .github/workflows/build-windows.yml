name: Build Windows fork

on:
  push:
    branches: [DIY]
  workflow_dispatch:

permissions:
  contents: read

env:
  XRAY_VERSION: v26.10.21

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Download pinned Xray core
        shell: pwsh
        run: |
          $bin = 'resources/bin/win32-x64'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          Invoke-WebRequest "https://github.com/XTLS/Xray-core/releases/download/$env:XRAY_VERSION/Xray-windows-64.zip" -OutFile "$env:RUNNER_TEMP/xray.zip"
          Expand-Archive "$env:RUNNER_TEMP/xray.zip" -DestinationPath $bin -Force
          foreach ($name in @('geoip.dat', 'geosite.dat')) {
            if (Test-Path "$bin/$name") {
              Move-Item -LiteralPath "$bin/$name" -Destination "resources/bin/$name" -Force
            }
          }
          "XRAY_BINARY=$((Resolve-Path "$bin/xray.exe").Path)" >> $env:GITHUB_ENV

      - name: Test proxy configuration and Xray compatibility
        run: npm test

      - name: Download bundled Chrome
        run: npx @puppeteer/browsers install chrome@150.0.7871.115 --path resources/puppeteer

      - name: Build application
        run: npm run build

      - name: Package Windows x64 without publishing
        run: npx electron-builder --win nsis zip --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installer and portable package
        uses: actions/upload-artifact@v4
        with:
          name: GeekEZ-Browser-windows-x64-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.exe
            dist/*.zip
